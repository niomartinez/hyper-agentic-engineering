[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-agentic-engineering"
version = "0.1.0a3"
description = "Portable memory, lean context, and reliable handoffs for coding agents"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nio Martinez"}]
dependencies = []

[project.scripts]
hae = "hae.cli:main"

[tool.setuptools.packages.find]
include = ["hae*"]

[tool.setuptools.package-data]
hae = ["resources/*"]
